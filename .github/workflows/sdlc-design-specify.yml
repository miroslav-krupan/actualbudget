name: SDLC · Design · Specify

on:
  issues:
    types: [labeled]

jobs:
  specify-ask-questions:
    # React to the 'feature' label, but never to an implementation ticket
    # (those carry the same label but their title starts with [IMPL]).
    if: >
      github.event.label.name == 'feature' &&
      !startsWith(github.event.issue.title, '[IMPL]')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bugrasan/devcontainer-base-ai/base:latest
      # The image's default user is 'vscode' (uid 1000), which cannot write
      # to the runner's root-owned work/temp dirs, breaking JS actions like
      # checkout (EACCES on _runner_file_commands). Run as root to fix this;
      # the image's ENV PATH already exposes all tools (specify, copilot,
      # node) so no PATH adjustment is needed. The OS user is unrelated to
      # the git commit identity, which is set explicitly below.
      options: --user root

    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The container runs as root but the checked-out workspace is owned by a
      # different uid, so git refuses to operate ("dubious ownership"). Trust
      # it globally so every later git step (branch, commit, specify) works.
      - name: Trust workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create or switch to issue branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Slugify the issue title: lowercase, non-alphanumerics -> '-',
          # collapse repeats, trim leading/trailing '-', cap length.
          slug=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-50 | sed -E 's/-+$//')
          BRANCH="issue-${ISSUE_NUMBER}-${slug}"
          echo "Branch name: $BRANCH"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch exists on remote, checking it out."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            echo "Branch does not exist, creating it."
            git checkout -b "$BRANCH"
          fi

          # Expose the branch name to later steps.
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Ensure Spec Kit is bootstrapped
        run: |
          if [ -d ".specify" ]; then
            echo "Spec Kit already initialized (.specify exists), skipping init."
          else
            echo "Initializing Spec Kit for Copilot..."
            specify init --here --integration copilot --script sh \
              --ignore-agent-tools --force
          fi

      # First LLM call: generate the Spec Kit specification from the issue.
      # Only COPILOT_GITHUB_TOKEN is present, so this step cannot touch the repo.
      - name: Generate spec with Spec Kit (speckit.specify)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Write the issue to a file (injection-safe: variable contents are
          # not re-parsed for command substitution).
          printf '# Issue #%s: %s\n\n%s\n' \
            "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" > issue-context.md

          copilot --allow-all-tools -p "You are working inside a Spec Kit \
          enabled repository. Read the GitHub issue context from the file \
          ./issue-context.md and treat it as the feature description. Create a \
          feature specification by running the Spec Kit specify workflow, i.e. \
          execute the /speckit.specify slash command with that description. \
          Work fully non-interactively: do not ask questions and do not start \
          an interactive session. The generated spec MUST retain \
          [NEEDS CLARIFICATION: ...] markers for every ambiguity — do NOT \
          resolve or assume them. Do not run any git or gh commands."

          # Discover the feature directory Spec Kit created (e.g.
          # specs/001-fix-rule-stage-value) so later steps write alongside the
          # spec instead of at the repo root.
          SPEC_DIR=$(find specs -maxdepth 1 -type d -name '[0-9]*' | sort | tail -1)
          echo "Spec dir: $SPEC_DIR"
          echo "SPEC_DIR=$SPEC_DIR" >> "$GITHUB_ENV"

          # issue-context.md was only a handoff file for the LLM; drop it so it
          # is not committed.
          rm -f issue-context.md

      # Second LLM call: extract + rubber-duck the business clarification
      # questions. Still Copilot-only; no repo access.
      - name: Extract clarification questions (with rubber duck)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          copilot --allow-all-tools -p "You are working inside a Spec Kit \
          enabled repository where a feature spec was just generated at \
          ${SPEC_DIR}/spec.md. Do the following non-interactively:

          1. Read the spec at ${SPEC_DIR}/spec.md.
          2. Build a list of clarification questions that are STRICTLY \
          functional or business in nature. Source them from BOTH (a) the \
          [NEEDS CLARIFICATION] markers in the spec AND (b) any additional \
          business ambiguities you identify. Exclude purely technical or \
          implementation questions.
          3. Rubber duck your draft list to get a second opinion: run \
          /rubber-duck asking it to check whether each question is truly \
          business/functional, whether any are actually hidden assumptions, \
          and whether any important business questions are missing. Revise \
          your list based on the critique.
          4. You MUST NOT answer the questions, MUST NOT assume answers, and \
          MUST NOT run the interactive /speckit.clarify loop.
          5. Write the final result as JSON to \
          ${SPEC_DIR}/clarifications-round-1.json using this schema: \
          {\"issue\": ${ISSUE_NUMBER}, \"round\": 1, \"questions\": \
          [{\"id\": \"Q1\", \"question\": \"...\", \"rationale\": \"why this \
          matters for the business behavior\"}]}. If there are no business \
          clarifications, write {\"issue\": ${ISSUE_NUMBER}, \"round\": 1, \
          \"questions\": []}.
          6. Also write a human-readable Markdown comment body to \
          ${SPEC_DIR}/clarifications-round-1.md. Start it with the line \
          'Spec Kit — business clarification questions'. If there are \
          questions, list them as a numbered list including each rationale; if \
          there are none, state that no business clarifications are needed.

          Do not run any git or gh commands."

      # gh step: only GH_TOKEN is present. Dumb publisher of the file above.
      - name: Post clarification questions as issue comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body-file "${SPEC_DIR}/clarifications-round-1.md"
          # The rendered Markdown is scratch — the .json is the committed source
          # of truth, so drop the .md before the commit step.
          rm -f "${SPEC_DIR}/clarifications-round-1.md"

      - name: Commit and push spec artifacts
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "miroslav-krupan"
          git config user.email "89612868+miroslav-krupan@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[AI] Created specification for issue #${ISSUE_NUMBER}"
            git push -u origin "$BRANCH"
          fi

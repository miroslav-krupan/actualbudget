name: AI Agent Demo

on:
  issues:
    types: [labeled]

jobs:
  analyze-issue:
    if: github.event.label.name == 'feature'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bugrasan/devcontainer-base-ai/base:latest

    permissions:
      issues: write

    steps:
      # Copilot CLI step: only COPILOT_GITHUB_TOKEN is present, so the agent
      # can only authenticate against the business Copilot seat. No gh token
      # is exposed here, so this step cannot touch the repo.
      - name: Analyze issue with Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: |
          copilot --allow-all-tools -p "You are a software engineer triaging a \
          GitHub issue in the repository ${REPO}.

          Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}

          Issue body:
          ${ISSUE_BODY}

          Task: Analyze this issue and write a short analysis (3-5 bullet \
          points) covering what the problem is, which files or areas likely \
          need to change, and a suggested fix approach. Do not write code.

          Write ONLY the analysis text to the file ./analysis.md in the current \
          directory. Start the file with the line '🤖 Copilot CLI analysis' \
          followed by a blank line. Do not run any git or gh commands."

      # gh step: only GH_TOKEN is present, so this step can only talk to the
      # repo. It has no Copilot access. It just posts the file produced above.
      - name: Post analysis as issue comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file ./analysis.md

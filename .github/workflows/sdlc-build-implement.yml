name: SDLC · Build · Implement

on:
  issue_comment:
    types: [created]

# Serialise runs per implementation ticket so two quick dev comments don't
# race on the same branch.
concurrency:
  group: sdlc-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  develop:
    # React to a human comment on an open implementation ticket, identified
    # solely by its [IMPL] title prefix; ignore PRs and our own bot comments.
    if: >
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '[IMPL]') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bugrasan/devcontainer-base-ai/base:latest
      # Run as root: the image's default 'vscode' user cannot write the
      # runner's root-owned dirs (breaks checkout). The image ENV PATH already
      # exposes specify, copilot, and node.
      options: --user root

    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trust workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The feature branch name is embedded as a hidden marker in the IMPL
      # ticket body: <!-- feature-branch: issue-N-... -->. Parse it from the
      # event payload (injection-safe: env var, parsed not executed).
      - name: Check out the feature branch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BRANCH=$(printf '%s' "$ISSUE_BODY" \
            | sed -nE 's/.*feature-branch: ([^ ]+) -->.*/\1/p' | head -1)
          if [ -z "$BRANCH" ]; then
            echo "::error::feature-branch marker not found in the IMPL ticket body."
            exit 1
          fi
          echo "Feature branch: $BRANCH"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Determine spec dir and mode
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          SPEC_DIR=$(find specs -maxdepth 1 -type d -name '[0-9]*' | sort | tail -1)
          if [ -z "$SPEC_DIR" ]; then
            echo "::error::No spec directory found under specs/."
            exit 1
          fi
          # "/ready" anywhere in the comment => implement; otherwise refine.
          if printf '%s' "$COMMENT_BODY" | grep -q '/ready'; then
            MODE=IMPLEMENT
          else
            MODE=REFINE
          fi
          # Hand the comment to the LLM via a file (injection-safe).
          printf '%s' "$COMMENT_BODY" > dev-comment.md
          echo "SPEC_DIR=$SPEC_DIR"; echo "MODE=$MODE"
          { echo "SPEC_DIR=$SPEC_DIR"; echo "MODE=$MODE"; } >> "$GITHUB_ENV"

      # REFINE: fold the developer's feedback into the existing plan (do not
      # regenerate it). Copilot-only; no repo access.
      - name: Refine plan from feedback
        if: env.MODE == 'REFINE'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          copilot --allow-all-tools -p "You are working inside a Spec Kit \
          enabled repository on the feature branch for implementation ticket \
          #${ISSUE_NUMBER}. A developer left feedback in ./dev-comment.md, and \
          may also have committed changes to this branch. Work \
          non-interactively and do NOT run git or gh:

          1. Read ./dev-comment.md and review any recent changes or files on \
          this branch relevant to the feedback.
          2. Update the implementation plan at ${SPEC_DIR}/plan.md to \
          incorporate the developer's feedback. Edit the existing plan in \
          place — do NOT regenerate it from scratch, and preserve the \
          developer's intent and any manual edits. If the feedback changes \
          intended behaviour, also update ${SPEC_DIR}/spec.md. Keep the \
          '## References' section of plan.md intact.
          3. Write a SHORT summary of exactly what you changed (a few bullet \
          points, do not restate the whole plan) to ./refine-summary.md, \
          starting with the line 'Plan updated from developer feedback'."

      # Install deps once (IMPLEMENT only) so the LLM can run the affected
      # package's tests during implementation, and so the deterministic gate
      # can run them afterwards. ~40s including native builds.
      - name: Install dependencies
        if: env.MODE == 'IMPLEMENT'
        run: |
          corepack enable || true
          yarn install --immutable

      # IMPLEMENT: the developer signalled /ready. Build the code the Spec Kit
      # way (tasks -> implement), write tests, and self-verify to green.
      # Copilot-only; no repo access.
      - name: Implement feature
        if: env.MODE == 'IMPLEMENT'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          copilot --allow-all-tools -p "You are working inside a Spec Kit \
          enabled repository on the feature branch for implementation ticket \
          #${ISSUE_NUMBER}. The plan is at ${SPEC_DIR}/plan.md and the spec at \
          ${SPEC_DIR}/spec.md. The developer signalled readiness to implement \
          (final notes, if any, are in ./dev-comment.md). Dependencies are \
          already installed. Work non-interactively and do NOT run git or gh:

          1. Generate the task breakdown by running the /speckit.tasks slash \
          command for the current feature.
          2. Implement the feature by running the /speckit.implement slash \
          command: make the code changes the plan describes AND write \
          automated tests for the new/changed behaviour in the affected \
          package, following that package's existing test conventions. Honour \
          any final notes in ./dev-comment.md.
          3. Run the affected package's FULL test suite yourself and keep \
          iterating — fix the code or the tests and re-run — until the whole \
          suite passes. There is no iteration limit; only stop once every test \
          is green. For @actual-app/core the command is \
          'yarn workspace @actual-app/core test'. Do NOT consider the work \
          finished while any test fails.
          4. Write a SHORT summary of what you implemented (files changed, key \
          decisions, how to verify) to ./implement-summary.md, starting with \
          the line 'Implementation complete'.
          5. Write ./test-ticket.md: a short description of the change and \
          concrete steps for a tester to verify it (this becomes a testing \
          ticket body). Describe what changed and how to test it; do not list \
          every automated test."

      # Deterministic gate: re-run the affected package's suite and capture
      # auditable evidence. The vitest exit code — not the LLM — is the source
      # of truth. If the run disagrees with the LLM it feeds the failure back
      # and re-runs (up to MAX_GATE_ATTEMPTS). Only the Copilot token is
      # present, so the in-loop fix can't touch the repo.
      - name: Test gate (run suite + capture evidence)
        if: env.MODE == 'IMPLEMENT'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bash .github/scripts/run-test-gate.sh "$SPEC_DIR" impl

      # gh step: publish the outcome on the IMPL ticket.
      - name: Publish outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"

          if [ "$MODE" = "REFINE" ]; then
            # Keep the IMPL body in sync with the current plan, re-appending
            # the hidden branch marker so future runs can still find it.
            {
              cat "${SPEC_DIR}/plan.md"
              printf '\n<!-- feature-branch: %s -->\n' "$BRANCH"
            } > impl-body.md
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --body-file impl-body.md
            rm -f impl-body.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
              --body-file ./refine-summary.md
          else
            # Comment: the LLM's summary + a deterministic test-gate section.
            {
              cat ./implement-summary.md
              echo
              echo "## Test gate"
              echo "- Result: $([ "$TESTS_PASSED" = true ] && echo '✅ PASSED' || echo '❌ FAILED') ($((TESTS_TOTAL - TESTS_FAILED))/$TESTS_TOTAL passed in \`$TESTS_PKG\`)"
              echo "- Evidence: $SERVER_URL/$REPO/blob/$BRANCH/$EVIDENCE_DIR/summary.md"
              echo "- Full run: $RUN_URL"
            } > impl-comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file impl-comment.md
            rm -f impl-comment.md

            # Only open the [TEST] ticket when the gate is genuinely green.
            if [ "$TESTS_PASSED" = "true" ]; then
              DESIGN_TITLE=${ISSUE_TITLE#'[IMPL] '}
              # The design ticket number is encoded in the branch name
              # (issue-<N>-slug); the IMPL ticket is the current issue.
              DESIGN_ISSUE=$(printf '%s' "$BRANCH" | sed -nE 's/^issue-([0-9]+)-.*/\1/p')
              {
                cat ./test-ticket.md
                echo
                echo "## Tests run (regression + new)"
                cat "$EVIDENCE_DIR/summary.md"
                echo
                echo "**Evidence:** $SERVER_URL/$REPO/tree/$BRANCH/$EVIDENCE_DIR"
                echo "**Full run:** $RUN_URL"
                printf '\n<!-- feature-branch: %s -->\n' "$BRANCH"
                printf '<!-- design-issue: %s -->\n' "$DESIGN_ISSUE"
                printf '<!-- impl-issue: %s -->\n' "$ISSUE_NUMBER"
              } > test-body.md
              gh issue create --repo "$REPO" \
                --title "[TEST] $DESIGN_TITLE" \
                --body-file test-body.md
              rm -f test-body.md
            fi
          fi

      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "miroslav-krupan"
          git config user.email "89612868+miroslav-krupan@users.noreply.github.com"

          # Drop scratch handoff files so only real artifacts (code, tests,
          # and the committed test-results/ evidence) persist.
          rm -f dev-comment.md refine-summary.md implement-summary.md test-ticket.md

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            if [ "$MODE" = "IMPLEMENT" ]; then
              MSG="[AI] Implement feature and tests for ticket #${ISSUE_NUMBER}"
            else
              MSG="[AI] Update implementation plan from feedback for ticket #${ISSUE_NUMBER}"
            fi
            git commit -m "$MSG"
            git push -u origin "$BRANCH"
          fi

      # Fail the job if the gate wasn't green. Runs after commit so the
      # evidence is always committed and auditable, even on failure.
      - name: Enforce test result
        if: env.MODE == 'IMPLEMENT'
        run: |
          if [ "$TESTS_PASSED" != "true" ]; then
            echo "::error::Test gate failed (${TESTS_FAILED} failing in ${TESTS_PKG}). See committed evidence and the run log."
            exit 1
          fi
          echo "Test gate passed: ${TESTS_TOTAL} tests, 0 failing."
